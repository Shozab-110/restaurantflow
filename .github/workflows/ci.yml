name: RestaurantFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restaurantflow_ci
          POSTGRES_USER: restaurantflow_ci
          POSTGRES_PASSWORD: ci-only-disposable-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantflow_ci -d restaurantflow_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_SSL_REDIRECT: "false"
      TRUST_PROXY_HEADERS: "false"
      POSTGRES_DB: restaurantflow_ci
      POSTGRES_USER: restaurantflow_ci
      POSTGRES_PASSWORD: ci-only-disposable-database
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      APP_PORT: "8010"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci
      - name: Generate disposable development configuration
        run: |
          python scripts/configure_local.py --port 5432 --database restaurantflow_ci --user restaurantflow_ci
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for name in ['DJANGO_SECRET_KEY', 'RESTAURANTFLOW_DEMO_PASSWORD', 'RESTAURANTFLOW_OWNER_PASSWORD']:
                  handle.write(name + '=' + secrets.token_urlsafe(60) + '\n')
          PY
      - name: Build frontend and verify configuration
        run: |
          npm run build
          python manage.py migrate --noinput
          python manage.py bootstrap_roles
          python manage.py collectstatic --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m unittest discover -s tests -v
          python scripts/check_docs.py
      - name: Run PostgreSQL workflow and concurrency tests
        run: python manage.py test operations.tests --noinput --verbosity 2
      - name: Verify POS interactions against actual rendered markup
        run: |
          python manage.py seed_demo --confirm-demo
          python scripts/render_pos_fixture.py
          npm run test:pos
      - name: Verify production security settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_SSL_REDIRECT: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build and start the complete Docker stack
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8010/health/
          curl --fail http://127.0.0.1:8010/login/ --output /dev/null
          docker compose exec -T -e RESTAURANTFLOW_OWNER_PASSWORD web python manage.py create_owner --username ci-owner
          docker compose exec -T -e DJANGO_DEBUG=false -e DJANGO_SECURE_SSL_REDIRECT=true web python manage.py check --deploy --fail-level WARNING
      - name: Container diagnostics
        if: always()
        run: docker compose logs --no-color --tail=80
      - name: Stop CI containers
        if: always()
        run: docker compose down
