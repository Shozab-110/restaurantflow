name: Bug report
description: Report a reproducible RestaurantFlow problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Never attach .env files, passwords, database dumps, or real customer/payment data. Report security vulnerabilities privately; see SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the operation, affected role, and observed result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as a cashier\n2. Create a takeaway order\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "Output of git rev-parse --short HEAD"
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized evidence
      description: Include OS, Python/PostgreSQL versions, native/Docker setup, and redacted errors or screenshots.
