name: Feature request
description: Suggest an operational improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Restaurant workflow or problem
      description: Explain who needs this and the concrete business task.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
