# Alternative to docker-compose.cohost.yml when a host proxy already owns 80/443.
name: restaurantflow
x-app: &app
  build: .
  image: restaurantflow-app:local
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  volumes:
    - media:/app/media
    - static:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    env_file: .env.database
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  init:
    <<: *app
    env_file: [.env, .env.migration]
    restart: "no"
    command: ["python", "scripts/initialize_cohost.py"]
    mem_limit: 512m
    cpus: 1
  web:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    command: ["gunicorn", "restaurantflow.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1
  proxy:
    image: caddy:2.11.7-alpine
    depends_on:
      web:
        condition: service_healthy
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./deploy/Caddyfile.shared:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
volumes:
  postgres:
  media:
  static:
